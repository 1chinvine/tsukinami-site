name: Daily Refresh

on:
  schedule:
    # 毎日 21:00 UTC = 日本時間 06:00
    - cron: '0 21 * * *'

  # GitHubの画面から手動更新もできるようにする
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"